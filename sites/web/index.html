<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="GiftU · A gift guessing game with GuBot">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>GiftU</title>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <header>
    <a class="brand" href="./">Gift<span>U</span></a>
    <div class="tools">
      <button class="quiet" id="sound" type="button" aria-pressed="false" hidden></button>
      <button class="quiet" id="install" type="button" hidden></button>
      <select id="lang" aria-label="Ngôn ngữ">
        <option value="vi">VI</option><option value="en">EN</option><option value="zh">中文</option>
      </select>
    </div>
  </header>
  <svg id="impact-gift" viewBox="0 0 160 160" aria-hidden="true" focusable="false" hidden><use></use></svg>
  <main data-screen="entry">
    <div id="scene" class="scene" aria-hidden="true">
      <div id="avatar"></div>
      <div id="artifact" hidden>
        <svg id="clay-gift" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
          <use id="gift-shape"></use>
        </svg>
      </div>
    </div>
    <div class="experience">
      <section class="intro" aria-labelledby="headline">
        <h1 id="headline" tabindex="-1">Biến việc tặng quà thành một trò chơi.</h1>
        <p id="intro">Tôi là GuBot. Bạn muốn tặng quà hay được mời chơi?</p>
        <div id="entry-roles" class="gift-paths" hidden>
          <button id="choose-giver" class="gift-path gift-path-open" type="button"></button>
          <button id="choose-receiver" class="gift-path gift-path-planned" type="button"></button>
        </div>
        <div id="gift-paths" class="gift-paths" hidden>
          <button class="gift-path gift-path-planned" id="open-hunt" type="button">
            <strong id="hunt"></strong><span id="huntDetail"></span>
          </button>
          <button class="gift-path gift-path-open" id="open-setup" type="button">
            <strong id="guess"></strong><span id="guessDetail"></span>
          </button>
        </div>
        <div class="actions">
          <button class="quiet" id="start" type="button" hidden></button>
          <button class="quiet" id="intro-back" type="button" hidden></button>
        </div>
        <p class="small" id="scope" hidden></p>
        <noscript><p>Bật JavaScript để chơi. Enable JavaScript to play. 请启用 JavaScript 开始游戏。</p></noscript>
      </section>
      <section id="setup" aria-labelledby="setup-title" hidden>
        <h1 id="setup-title" tabindex="-1"></h1>
        <p id="setup-lead"></p>
        <ol class="invite-steps" id="invite-steps"></ol>
        <details class="invite-preview"><summary id="preview-title"></summary><blockquote id="preview-greeting"></blockquote><p id="preview-consent"></p></details>
        <div class="choices" role="group" id="profiles">
          <button id="her" type="button"></button>
          <button id="him" type="button"></button>
        </div>
        <div class="actions">
          <button class="primary" id="create-room" type="button"></button>
          <button class="quiet" id="close-setup" type="button"></button>
        </div>
        <div id="links"></div>
      </section>
      <section id="game" tabindex="-1" aria-live="polite" hidden></section>
      <p id="room-error" role="alert" hidden></p>
    </div>
  </main>
  <dialog id="help">
    <p id="helptext"></p>
    <p class="small" id="build">Spike A v0.4.3</p>
    <form method="dialog"><button id="close" type="submit"></button></form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
