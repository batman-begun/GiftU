<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<meta name="description" content="GiftU · A gift guessing game with GuBot">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>GiftU</title>
<header><a class="brand" href="./">Gift<span>U</span><i></i></a><div class="tools"><button id="install" type="button"></button><select id="lang" aria-label="Language"><option value="vi">VI</option><option value="en">EN</option><option value="zh">中文</option></select></div></header>
<main>
<section class="intro">
<p class="kicker"><span></span> <span id="build">LIVE TESTBED · 0.2.0</span></p>
<h1 id="headline"></h1><p id="intro"></p>
<div class="choices" role="group" id="profiles"><button id="her" type="button"></button><button id="him" type="button"></button></div>
<button class="primary" id="start" type="button"></button>
<button id="create-room" type="button"></button>
<p class="small" id="scope"></p>
<div id="links"></div><p id="room-error" role="alert"></p>
</section>
<section class="room" aria-labelledby="room-title">
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="roombar"><h2 id="room-title">GuBot</h2><button id="sound" type="button" aria-pressed="false"></button></div>
<div class="stage"><div class="bot" aria-hidden="true"><div class="antenna"></div><div class="shell"><div class="face"><b></b><b></b><i></i></div></div><div class="bot-shadow"></div></div><div id="game" aria-live="polite"></div></div>
</section>
</main>
<dialog id="help"><p id="helptext"></p><form method="dialog"><button id="close" type="submit"></button></form></dialog>
<script type="module" src="./app.js"></script>
</html>
